name: Docker Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: gumi236/moodflix-v2

jobs:
  docker:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    # Jalan kalau pipeline CI nya sukses
    # needs: [build, lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Buildx mendukung multi-platform build dan layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Metadata untuk tag otomatis (latest + short SHA)
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Inject NEXT_PUBLIC_* sebagai build args (di-bake ke bundle Next.js)
          build-args: |
            NEXT_PUBLIC_TMDB_API_BASE_URL=${{ secrets.NEXT_PUBLIC_TMDB_API_BASE_URL }}
            NEXT_PUBLIC_TMDB_API_TOKEN=${{ secrets.NEXT_PUBLIC_TMDB_API_TOKEN }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          # Cache layers untuk mempercepat build berikutnya
          cache-from: type=gha
          cache-to: type=gha,mode=max
