services:
  web:
    image: gumi236/moodflix-v2:latest 
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TMDB_API_BASE_URL: ${NEXT_PUBLIC_TMDB_API_BASE_URL}
        NEXT_PUBLIC_TMDB_API_TOKEN: ${NEXT_PUBLIC_TMDB_API_TOKEN}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_TMDB_API_BASE_URL=${NEXT_PUBLIC_TMDB_API_BASE_URL}
      - NEXT_PUBLIC_TMDB_API_TOKEN=${NEXT_PUBLIC_TMDB_API_TOKEN}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    networks:
      - app_network
networks:
  app_network:
    driver: bridge